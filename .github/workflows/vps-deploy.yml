name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy (pull + compose up)
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="/opt/mosquito/Mosquito-detection"
          cd "$APP_DIR"

          git fetch --all --prune
          git reset --hard origin/main

          docker compose up -d --build
          docker compose --profile train up -d --build
