version: "3.9"
name: mosquito-id

services:
  db:
    image: postgres:16
    container_name: ${CONTAINER_PREFIX:-mosquito}-db
    environment:
      POSTGRES_DB: mosquito
      POSTGRES_USER: mosquito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    cpus: ${DB_CPUS:-1.0}
    mem_limit: ${DB_MEM:-1024m}
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosquito -d mosquito || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-5}
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: ${CONTAINER_PREFIX:-mosquito}-redis
    cpus: ${REDIS_CPUS:-0.25}
    mem_limit: ${REDIS_MEM:-256m}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-5}
    restart: unless-stopped

  backend:
    image: ghcr.io/truongnt/mosquito-detection-backend:main
    container_name: ${CONTAINER_PREFIX:-mosquito}-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://mosquito:${POSTGRES_PASSWORD}@db:5432/mosquito
      REDIS_URL: redis://redis:6379/0
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      MODEL_PATH: /app/models/saved/best_model.pth
      UPLOAD_DIR: /app/data/uploads
      LOG_DIR: /app/logs
    volumes:
      - ./ml/models/saved:/app/models/saved:ro
      - ./data/uploads:/app/data/uploads
      - app_logs:/app/logs
    depends_on:
      - db
      - redis
    cpus: ${BACKEND_CPUS:-1.0}
    mem_limit: ${BACKEND_MEM:-1024m}
    pids_limit: 512
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-5}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  worker:
    image: ghcr.io/truongnt/mosquito-detection-backend:main
    container_name: ${CONTAINER_PREFIX:-mosquito}-worker
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg2://mosquito:${POSTGRES_PASSWORD}@db:5432/mosquito
      REDIS_URL: redis://redis:6379/0
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      MODEL_DIR: /app/models/saved
      DATA_DIR: /app/data
      LOG_DIR: /app/logs
    volumes:
      - ./ml:/app/ml
      - ./ml/models/saved:/app/models/saved
      - ./data:/app/data
      - app_logs:/app/logs
    depends_on:
      - db
      - redis
    cpus: ${WORKER_CPUS:-2.0}
    mem_limit: ${WORKER_MEM:-2048m}
    pids_limit: 1024
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-5}
    restart: unless-stopped
    profiles: ["train"]

  frontend:
    image: ghcr.io/truongnt/mosquito-detection-frontend:main
    container_name: ${CONTAINER_PREFIX:-mosquito}-frontend
    cpus: ${FRONTEND_CPUS:-0.5}
    mem_limit: ${FRONTEND_MEM:-256m}
    pids_limit: 256
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-5}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: ${CONTAINER_PREFIX:-mosquito}-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval ${WATCHTOWER_INTERVAL:-30} --cleanup --label-enable
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped
    profiles: ["autodeploy"]

volumes:
  db_data:
  app_logs:
